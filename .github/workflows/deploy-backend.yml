name: Deploy Backend to Lambda

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        run: aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 807598718352.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build Docker image
        run: docker build --platform linux/amd64 --provenance=false -t 807598718352.dkr.ecr.ap-south-1.amazonaws.com/wardrobe-intelligence-backend:latest .

      - name: Push to ECR
        run: docker push 807598718352.dkr.ecr.ap-south-1.amazonaws.com/wardrobe-intelligence-backend:latest

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name wardrobe-intelligence-backend \
            --image-uri 807598718352.dkr.ecr.ap-south-1.amazonaws.com/wardrobe-intelligence-backend:latest \
            --region ap-south-1
          aws lambda wait function-updated-v2 \
            --function-name wardrobe-intelligence-backend \
            --region ap-south-1
